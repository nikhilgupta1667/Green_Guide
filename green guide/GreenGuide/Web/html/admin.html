<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel - Green Guide</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f9f1;
      color: #2f5233;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #317b42;
      padding: 1rem 2rem;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-weight: 700;
    }

    nav a {
      color: #d4f1d4;
      margin-left: 1rem;
      text-decoration: none;
      font-weight: 600;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h2 {
      color: #275d30;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 8px rgb(49 123 66 / 0.15);
    }

    th, td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid #d4f1d4;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background-color: #317b42;
      color: white;
      font-weight: 700;
    }

    tr:hover {
      background-color: #e6f1e6;
    }

    img.thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button.edit-btn {
      background-color: #317b42;
      color: white;
      border: none;
      padding: 0.4rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    button.edit-btn:hover {
      background-color: #275d30;
    }

    /* Responsive */
    @media (max-width: 700px) {
      table, thead, tbody, th, td, tr { 
        display: block; 
      }
      th {
        position: absolute;
        top: -9999px;
        left: -9999px;
      }
      tr {
        border: 1px solid #ccc;
        margin-bottom: 1rem;
        border-radius: 8px;
        padding: 1rem;
      }
      td {
        border: none;
        padding: 0.5rem 0;
        position: relative;
        padding-left: 50%;
      }
      td::before {
        position: absolute;
        top: 0.5rem;
        left: 0.8rem;
        width: 45%;
        white-space: nowrap;
        font-weight: 600;
        color: #317b42;
      }
      td:nth-of-type(1)::before { content: "Image"; }
      td:nth-of-type(2)::before { content: "Disease"; }
      td:nth-of-type(3)::before { content: "Date"; }
      td:nth-of-type(4)::before { content: "Actions"; }
      img.thumb {
        width: 100%;
        height: auto;
        margin-bottom: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Admin Panel - Green Guide</h1>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="upload.html">Upload Screen</a>
      <a href="about.html">About & Help</a>
      <!-- Add more links if needed -->
    </nav>
  </header>

  <main>
    <h2>User Uploads</h2>
    <table>
      <thead>
        <tr>
          <th>Plant Image</th>
          <th>Disease Detected</th>
          <th>Upload Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><img class="thumb" src="https://via.placeholder.com/80x80?text=Plant1" alt="Plant upload 1" /></td>
          <td>Powdery Mildew</td>
          <td>2025-05-18 14:22</td>
          <td><button class="edit-btn" onclick="alert('Edit remedy for Powdery Mildew')">Edit Remedy</button></td>
        </tr>
        <tr>
          <td><img class="thumb" src="https://via.placeholder.com/80x80?text=Plant2" alt="Plant upload 2" /></td>
          <td>Healthy</td>
          <td>2025-05-18 15:10</td>
          <td><button class="edit-btn" onclick="alert('No remedy needed for Healthy')">Edit Remedy</button></td>
        </tr>
        <tr>
          <td><img class="thumb" src="https://via.placeholder.com/80x80?text=Plant3" alt="Plant upload 3" /></td>
          <td>Leaf Spot</td>
          <td>2025-05-17 09:45</td>
          <td><button class="edit-btn" onclick="alert('Edit remedy for Leaf Spot')">Edit Remedy</button></td>
        </tr>
      </tbody>
    </table>
  </main>

</body>
</html>
